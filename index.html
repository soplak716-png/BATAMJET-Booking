<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batam Jet Booking</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#0b7a75;
  color:white;
  padding:24px 20px;
  text-align:center;
}

header h1{margin:0;font-size:26px}
header p{margin:8px 0 0;opacity:.9}

.container{
  max-width:600px;
  margin:25px auto;
  padding:0 16px;
}

.card{
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  font-weight:bold;
}

select,input,button{
  width:100%;
  padding:13px;
  border-radius:10px;
  font-size:16px;
}

select,input{
  border:1px solid #d5dbe5;
  background:white;
}

button{
  margin-top:20px;
  border:none;
  background:#0b7a75;
  color:white;
  font-weight:bold;
}

.secondary{
  background:#e5e7eb;
  color:#172033;
}

.message{margin-top:15px}

.error{
  background:#ffe7e7;
  color:#b00020;
  padding:12px;
  border-radius:10px;
}

.success{
  background:#e7f8ef;
  color:#087443;
  padding:12px;
  border-radius:10px;
}

.schedule{
  border:1px solid #e0e5ec;
  border-radius:14px;
  padding:16px;
  margin-top:12px;
}

.price{
  font-size:22px;
  font-weight:bold;
  color:#0b7a75;
  margin-top:10px;
}

.small{
  color:#667085;
  font-size:14px;
}

.passenger{
  border:1px solid #e0e5ec;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
}

.passenger h4{
  margin:0 0 10px;
}

.total{
  font-size:22px;
  font-weight:bold;
  color:#0b7a75;
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #ddd;
}

.booking-code{
  font-size:24px;
  font-weight:bold;
  text-align:center;
  color:#0b7a75;
  margin:18px 0;
}

.hidden{display:none}
</style>
</head>

<body>

<header>
<h1>Batam Jet Booking</h1>
<p>Booking tiket kapal dari Dumai</p>
</header>

<div class="container">

<!-- CARI JADWAL -->
<div class="card" id="searchCard">

<h2>Cari Jadwal</h2>

<label>Tujuan</label>

<select id="destination">
<option value="">Pilih tujuan</option>
</select>

<label>Tanggal</label>

<input
type="date"
id="date"
value="2026-10-05"
>

<button onclick="cariJadwal()">
Cari Jadwal
</button>

<div id="message" class="message"></div>

<div id="results" style="display:none">

<h3>Jadwal Tersedia</h3>

<div id="scheduleList"></div>

</div>

</div>


<!-- BOOKING -->
<div class="card hidden" id="bookingCard">

<h2>Data Penumpang</h2>

<div id="bookingInfo"></div>

<label>Nama Pemesan</label>

<input
type="text"
id="customerName"
placeholder="Nama pemesan"
>

<label>Nomor WhatsApp Pemesan</label>

<input
type="tel"
id="customerPhone"
placeholder="Contoh: 08123456789"
>

<label>Email (opsional)</label>

<input
type="email"
id="customerEmail"
placeholder="nama@email.com"
>

<label>Jumlah Penumpang</label>

<select id="passengerCount" onchange="buatPenumpang()">
<option value="">Pilih jumlah</option>
</select>

<div id="passengerList"></div>

<div id="totalBox"></div>

<button onclick="simpanBooking()">
Konfirmasi Booking
</button>

<button
class="secondary"
onclick="kembali()"
>
Kembali
</button>

<div id="bookingMessage" class="message"></div>

</div>


<!-- BERHASIL -->
<div class="card hidden" id="successCard">

<h2>Booking Berhasil 🎉</h2>

<div class="success">
Booking berhasil disimpan.
</div>

<div
id="bookingCode"
class="booking-code"
></div>

<div id="successDetail"></div>

<button onclick="location.reload()">
Booking Baru
</button>

</div>

</div>


<script>

const SUPABASE_URL =
"https://iymqjdfeadmqvxjanndq.supabase.co";

const SUPABASE_KEY =
"sb_publishable__ihz_ZnsNjw8YxZyMA-eeg_TQQlWF89";


async function supabase(path, options = {}) {

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + path,
    {
      method: options.method || "GET",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },

      body: options.body || undefined
    }
  );

  const text = await response.text();

  if (!response.ok) {
    console.error("SUPABASE ERROR:", text);
    throw new Error(text);
  }

  return text ? JSON.parse(text) : [];
}


/* =========================
   LOAD TUJUAN
========================= */

async function loadRoutes() {

  const destination =
    document.getElementById("destination");

  try {

    const routes = await supabase(
      "routes?origin=eq.Dumai&active=eq.true&select=id,destination&order=destination"
    );

    destination.innerHTML =
      '<option value="">Pilih tujuan</option>';

    const tujuan = [];

    routes.forEach(route => {

      if (
        route.destination &&
        !tujuan.includes(route.destination)
      ) {

        tujuan.push(route.destination);

      }

    });

    tujuan.forEach(nama => {

      const option =
        document.createElement("option");

      option.value = nama;

      option.textContent =
        "Dumai → " + nama;

      destination.appendChild(option);

    });

    if (tujuan.length === 0) {

      document.getElementById("message").innerHTML =
        '<div class="error">Tidak ada tujuan tersedia.</div>';

    }

  } catch (error) {

    console.error(error);

    document.getElementById("message").innerHTML =
      '<div class="error">Gagal mengambil daftar tujuan.</div>';

  }

}


/* =========================
   CARI JADWAL
========================= */

async function cariJadwal() {

  const destination =
    document.getElementById("destination").value;

  const date =
    document.getElementById("date").value;

  const message =
    document.getElementById("message");

  const results =
    document.getElementById("results");

  const list =
    document.getElementById("scheduleList");


  if (!destination || !date) {

    message.innerHTML =
      '<div class="error">Pilih tujuan dan tanggal terlebih dahulu.</div>';

    return;
  }


  message.innerHTML =
    '<div class="success">Mencari jadwal...</div>';

  results.style.display = "none";
  list.innerHTML = "";


  try {

    const schedules = await supabase(
      "schedules?departure_date=eq." +
      encodeURIComponent(date) +
      "&destination=eq." +
      encodeURIComponent(destination) +
      "&status=eq.available" +
      "&select=id,route_id,destination,departure_date,departure_time,price,available_seats,status"
    );


    message.innerHTML = "";
    results.style.display = "block";


    if (!schedules || schedules.length === 0) {

      list.innerHTML =
        "<p>Tidak ada jadwal pada tanggal tersebut.</p>";

      return;
    }


    schedules.forEach(schedule => {

      const time =
        schedule.departure_time
          ? schedule.departure_time.substring(0, 5)
          : "-";


      const price =
        Number(schedule.price || 0)
          .toLocaleString("id-ID");


      const seats =
        schedule.available_seats == null
          ? "-"
          : schedule.available_seats;


      const div =
        document.createElement("div");

      div.className = "schedule";


      div.innerHTML = `

        <strong>
          Dumai → ${schedule.destination}
        </strong>

        <p>
          <span class="small">Tanggal</span><br>
          ${schedule.departure_date}
        </p>

        <p>
          <span class="small">Jam berangkat</span><br>
          ${time}
        </p>

        <p>
          <span class="small">Kursi tersedia</span><br>
          ${seats}
        </p>

        <div class="price">
          Rp ${price}
        </div>

        <button>
          Lanjut Booking
        </button>

      `;


      div.querySelector("button").onclick = function() {

        booking(schedule);

      };


      list.appendChild(div);

    });


  } catch (error) {

    console.error("ERROR JADWAL:", error);

    message.innerHTML =
      '<div class="error">Gagal mengambil jadwal.</div>';

  }

}
/* =========================
   LANJUT BOOKING
========================= */

let selectedSchedule = null;


function booking(schedule) {

  selectedSchedule = schedule;


  document.getElementById("searchCard")
    .classList.add("hidden");

  document.getElementById("bookingCard")
    .classList.remove("hidden");


  const time =
    schedule.departure_time
      ? schedule.departure_time.substring(0, 5)
      : "-";


  const price =
    Number(schedule.price)
      .toLocaleString("id-ID");


  document.getElementById("bookingInfo").innerHTML = `

    <div class="schedule">

      <strong>
        Dumai → ${schedule.destination}
      </strong>

      <p>
        ${schedule.departure_date} · ${time}
      </p>

      <p>
        Harga per penumpang:
        <strong>Rp ${price}</strong>
      </p>

      <p>
        Kursi tersedia:
        <strong>${schedule.available_seats ?? "-"}</strong>
      </p>

    </div>

  `;


  const count =
    document.getElementById("passengerCount");


  count.innerHTML =
    '<option value="">Pilih jumlah</option>';


  const available =
    Number(schedule.available_seats || 0);


  const max =
    Math.min(10, available);


  for (let i = 1; i <= max; i++) {

    const option =
      document.createElement("option");

    option.value = i;

    option.textContent =
      i + " penumpang";

    count.appendChild(option);

  }


  buatPenumpang();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   BUAT FORM PENUMPANG
========================= */

function buatPenumpang() {

  const count =
    Number(
      document.getElementById("passengerCount").value
    );


  const list =
    document.getElementById("passengerList");


  const totalBox =
    document.getElementById("totalBox");


  list.innerHTML = "";

  totalBox.innerHTML = "";


  if (!count || !selectedSchedule) {

    return;

  }


  for (let i = 1; i <= count; i++) {

    const div =
      document.createElement("div");

    div.className = "passenger";


    div.innerHTML = `

      <h4>
        Penumpang ${i}
      </h4>

      <label>
        Nama Lengkap
      </label>

      <input
        type="text"
        class="passenger-name"
        placeholder="Nama lengkap"
      >

      <label>
        Jenis Identitas
      </label>

      <select class="passenger-identity-type">

        <option value="">
          Pilih identitas
        </option>

        <option value="KTP">
          KTP
        </option>

        <option value="SIM">
          SIM
        </option>

        <option value="Paspor">
          Paspor
        </option>

      </select>

      <label>
        Nomor Identitas
      </label>

      <input
        type="text"
        class="passenger-identity-number"
        placeholder="Nomor identitas"
      >

    `;


    list.appendChild(div);

  }


  hitungTotal();

}


/* =========================
   HITUNG TOTAL
========================= */

function hitungTotal() {

  if (!selectedSchedule) return;


  const count =
    Number(
      document.getElementById("passengerCount").value
    );


  if (!count) return;


  const total =
    Number(selectedSchedule.price) * count;


  document.getElementById("totalBox").innerHTML = `

    <div class="total">

      Total:
      Rp ${total.toLocaleString("id-ID")}

    </div>

  `;

}


/* =========================
   SIMPAN BOOKING
========================= */

async function simpanBooking() {

  const customerName =
    document.getElementById("customerName").value.trim();

  const customerPhone =
    document.getElementById("customerPhone").value.trim();

  const customerEmail =
    document.getElementById("customerEmail").value.trim();

  const count =
    Number(
      document.getElementById("passengerCount").value
    );


  const bookingMessage =
    document.getElementById("bookingMessage");


  if (!customerName || !customerPhone || !count) {

    bookingMessage.innerHTML =
      '<div class="error">Lengkapi data pemesan dan jumlah penumpang.</div>';

    return;

  }


  const names =
    document.querySelectorAll(".passenger-name");

  const identityTypes =
    document.querySelectorAll(".passenger-identity-type");

  const identityNumbers =
    document.querySelectorAll(".passenger-identity-number");


  const passengers = [];


  for (let i = 0; i < count; i++) {

    if (
      !names[i].value.trim() ||
      !identityTypes[i].value ||
      !identityNumbers[i].value.trim()
    ) {

      bookingMessage.innerHTML =
        '<div class="error">Lengkapi semua data penumpang.</div>';

      return;

    }


    passengers.push({

      full_name:
        names[i].value.trim(),

      identity_type:
        identityTypes[i].value,

      identity_number:
        identityNumbers[i].value.trim()

    });

  }


  const totalAmount =
    Number(selectedSchedule.price) * count;


  bookingMessage.innerHTML =
    '<div class="success">Menyimpan booking...</div>';


  try {

    const bookingResult =
      await supabase(
        "bookings",
        {
          method: "POST",

          body: JSON.stringify({

            schedule_id:
              selectedSchedule.id,

            customer_name:
              customerName,

            customer_phone:
              customerPhone,

            customer_email:
              customerEmail || null,

            total_passengers:
              count,

            total_amount:
              totalAmount,

            status:
              "pending"

          })

        }
      );


    const bookingId =
      bookingResult[0].id;


    for (const passenger of passengers) {

      await supabase(
        "passengers",
        {
          method: "POST",

          body: JSON.stringify({

            booking_id:
              bookingId,

            full_name:
              passenger.full_name,

            identity_type:
              passenger.identity_type,

            identity_number:
              passenger.identity_number

          })

        }
      );

    }


    document.getElementById("bookingCard")
      .classList.add("hidden");

    document.getElementById("successCard")
      .classList.remove("hidden");


    document.getElementById("bookingCode").innerHTML =
      "Kode Booking<br>" +
      bookingId.substring(0, 8).toUpperCase();


    document.getElementById("successDetail").innerHTML = `

      <p>
        <strong>
          Dumai → ${selectedSchedule.destination}
        </strong>
      </p>

      <p>
        Tanggal:
        ${selectedSchedule.departure_date}
      </p>

      <p>
        Jumlah penumpang:
        ${count}
      </p>

      <p>
        Total:
        <strong>
          Rp ${totalAmount.toLocaleString("id-ID")}
        </strong>
      </p>

    `;


  } catch (error) {

    console.error(error);

    bookingMessage.innerHTML =
      '<div class="error">Booking gagal disimpan. Periksa izin tabel Supabase.</div>';

  }

}


/* =========================
   KEMBALI
========================= */

function kembali() {

  document.getElementById("bookingCard")
    .classList.add("hidden");

  document.getElementById("searchCard")
    .classList.remove("hidden");

}


/* =========================
   MULAI
========================= */

loadRoutes();

</script>
