<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batam Jet Booking</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: #075985;
      color: white;
      padding: 22px 20px;
      border-radius: 0 0 24px 24px;
    }

    .header h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      opacity: .9;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .card h2 {
      font-size: 19px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 14px 0 7px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d6dce5;
      border-radius: 12px;
      background: white;
      font-size: 15px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #075985;
    }

    .schedule {
      border: 1px solid #dce3ec;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
    }

    .schedule strong {
      display: block;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .price {
      color: #075985;
      font-weight: bold;
      font-size: 18px;
      margin-top: 7px;
    }

    .button {
      width: 100%;
      border: none;
      padding: 15px;
      margin-top: 18px;
      border-radius: 12px;
      background: #075985;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .button:active {
      transform: scale(.98);
    }

    .notice {
      background: #eef6ff;
      padding: 13px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 15px;
    }

    .footer {
      text-align: center;
      padding: 25px;
      font-size: 12px;
      color: #718096;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="container">
      <h1>Batam Jet</h1>
      <p>Booking tiket kapal secara mudah dan cepat</p>
    </div>
  </header>

  <main class="container">

    <div class="card">
      <h2>Cari Jadwal Kapal</h2>

      <label for="destination">Tujuan</label>
      <select id="destination">
        <option value="">Pilih tujuan</option>
        <option value="Bengkalis">Dumai → Bengkalis</option>
        <option value="Selat Panjang">Dumai → Selat Panjang</option>
        <option value="Tanjung Balai Karimun">
          Dumai → Tanjung Balai Karimun
        </option>
        <option value="Batam">Dumai → Batam</option>
        <option value="Tanjung Pinang">
          Dumai → Tanjung Pinang
        </option>
      </select>

      <label for="date">Tanggal keberangkatan</label>
      <input type="date" id="date" value="2026-10-05">

      <button class="button" onclick="searchSchedule()">
        Cari Jadwal
      </button>
    </div>

    <div class="card" id="result" style="display:none;">
      <h2>Jadwal Tersedia</h2>

      <div class="schedule">
        <strong id="route"></strong>
        <div>Batam Jet</div>
        <div>Berangkat pukul 06:45</div>
        <div class="price" id="price"></div>

        <button class="button" onclick="booking()">
          Lanjut Booking
        </button>
      </div>
    </div>

    <div class="card">
      <h2>Informasi</h2>

      <div class="notice">
        Jadwal dan harga yang ditampilkan merupakan data yang
        telah dimasukkan ke sistem booking.
      </div>
    </div>

  </main>

  <div class="footer">
    © 2026 Batam Jet Booking
  </div>

  <script>
    const prices = {
      "Bengkalis": 140000,
      "Selat Panjang": 270000,
      "Tanjung Balai Karimun": 470000,
      "Batam": 590000,
      "Tanjung Pinang": 710000
    };

    function searchSchedule() {
      const destination =
        document.getElementById("destination").value;

      const date =
        document.getElementById("date").value;

      if (!destination || !date) {
        alert("Silakan pilih tujuan dan tanggal.");
        return;
      }

      document.getElementById("route").textContent =
        "Dumai → " + destination;

      document.getElementById("price").textContent =
        "Rp " + prices[destination].toLocaleString("id-ID");

      document.getElementById("result").style.display = "block";
    }

    function booking() {
      alert(
        "Halaman booking akan kita aktifkan pada tahap berikutnya."
      );
    }
  </script>

</body>
</html>
