<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batam Jet Booking</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#0b7a75;
  color:white;
  padding:24px 20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:8px 0 0;
  opacity:.9;
}

.container{
  max-width:600px;
  margin:25px auto;
  padding:0 16px;
}

.card{
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  font-weight:bold;
}

select,
input,
button{
  width:100%;
  padding:13px;
  border-radius:10px;
  font-size:16px;
}

select,
input{
  border:1px solid #d5dbe5;
  background:white;
}

button{
  margin-top:20px;
  border:none;
  background:#0b7a75;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#e5e7eb;
  color:#172033;
}

.message{
  margin-top:15px;
}

.error{
  background:#ffe7e7;
  color:#b00020;
  padding:12px;
  border-radius:10px;
}

.success{
  background:#e7f8ef;
  color:#087443;
  padding:12px;
  border-radius:10px;
}

.schedule{
  border:1px solid #e0e5ec;
  border-radius:14px;
  padding:16px;
  margin-top:12px;
  background:white;
}

.schedule strong{
  font-size:18px;
}

.price{
  font-size:22px;
  font-weight:bold;
  color:#0b7a75;
  margin-top:10px;
}

.small{
  color:#667085;
  font-size:14px;
}

.passenger{
  border:1px solid #e0e5ec;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
}

.passenger h4{
  margin:0 0 10px;
}

.total{
  font-size:22px;
  font-weight:bold;
  color:#0b7a75;
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #ddd;
}

.booking-code{
  font-size:24px;
  font-weight:bold;
  text-align:center;
  color:#0b7a75;
  margin:18px 0;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<header>
<h1>Batam Jet Booking</h1>
<p>Booking tiket kapal dari Dumai</p>
</header>

<div class="container">

<!-- =========================
CARI JADWAL
========================= -->

<div class="card" id="searchCard">

<h2>Cari Jadwal</h2>

<label for="destination">Tujuan</label>

<select id="destination">
<option value="">Pilih tujuan</option>
</select>

<label for="date">Tanggal</label>

<input
type="date"
id="date"
value="2026-10-05"
>

<button onclick="cariJadwal()">
Cari Jadwal
</button>

<div id="message" class="message"></div>

<div id="results" style="display:none">

<h3>Jadwal Tersedia</h3>

<div id="scheduleList"></div>

</div>

</div>


<!-- =========================
BOOKING
========================= -->

<div class="card hidden" id="bookingCard">

<h2>Data Penumpang</h2>

<div id="bookingInfo"></div>

<label for="customerName">
Nama Pemesan
</label>

<input
type="text"
id="customerName"
placeholder="Nama pemesan"
>

<label for="customerPhone">
Nomor WhatsApp Pemesan
</label>

<input
type="tel"
id="customerPhone"
placeholder="Contoh: 08123456789"
>

<label for="customerEmail">
Email (opsional)
</label>

<input
type="email"
id="customerEmail"
placeholder="nama@email.com"
>

<label for="passengerCount">
Jumlah Penumpang
</label>

<select
id="passengerCount"
onchange="buatPenumpang()"
>
<option value="">Pilih jumlah</option>
<option value="1">1 Penumpang</option>
<option value="2">2 Penumpang</option>
<option value="3">3 Penumpang</option>
<option value="4">4 Penumpang</option>
<option value="5">5 Penumpang</option>
<option value="6">6 Penumpang</option>
<option value="7">7 Penumpang</option>
<option value="8">8 Penumpang</option>
<option value="9">9 Penumpang</option>
<option value="10">10 Penumpang</option>
</select>

<div id="passengerList"></div>

<div id="totalBox"></div>

<button onclick="simpanBooking()">
Konfirmasi Booking
</button>

<button
class="secondary"
onclick="kembali()"
>
Kembali
</button>

<div id="bookingMessage" class="message"></div>

</div>


<!-- =========================
BERHASIL
========================= -->

<div class="card hidden" id="successCard">

<h2>Booking Berhasil 🎉</h2>

<div class="success">
Booking berhasil disimpan.
</div>

<div
id="bookingCode"
class="booking-code"
></div>

<div id="successDetail"></div>
<div id="countdownBox" class="success">
  ⏳ Selesaikan pembayaran dalam:
  <strong id="countdown">15:00</strong>
</div>
  
<button onclick="location.reload()">
Booking Baru
</button>

</div>

</div>


<script>

/* ===============================
SUPABASE
================================ */

const SUPABASE_URL =
"https://iymqjdfeadmqvxjanndq.supabase.co";

/*
  PENTING:
  Pertahankan SUPABASE_KEY yang sekarang
  sudah ada di GitHub kamu.
*/
const SUPABASE_KEY =
"sb_publishable__ihz_ZnsNjw8YxZyMA-eeg_TQQlWF89";


async function supabase(path, options={}){

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + path,
    {
      method: options.method || "GET",

      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=representation"
      },

      body:options.body || undefined
    }
  );

  const text = await response.text();

  if(!response.ok){

    console.error("Supabase error:",text);

    throw new Error(text);
  }

  return text ? JSON.parse(text) : [];
}


/* ===============================
DATA SCHEDULE TERPILIH
================================ */

let selectedSchedule = null;


/* ===============================
LOAD TUJUAN
DARI TABLE ROUTES
================================ */

async function loadRoutes(){

  const destination =
    document.getElementById("destination");

  try{

    const routes = await supabase(
      "routes?origin=eq.Dumai&active=eq.true&select=id,destination&order=destination"
    );

    destination.innerHTML =
      '<option value="">Pilih tujuan</option>';

    routes.forEach(route=>{

      const option =
        document.createElement("option");

      option.value =
        route.destination;

      option.textContent =
        "Dumai → " + route.destination;

      destination.appendChild(option);

    });

    if(routes.length === 0){

      document.getElementById("message").innerHTML =
      '<div class="error">Tidak ada tujuan tersedia.</div>';

    }

  }catch(error){

    console.error(error);

    document.getElementById("message").innerHTML =
    '<div class="error">Gagal mengambil tujuan dari database.</div>';
  }
}


/* ===============================
CARI JADWAL
================================ */

async function cariJadwal(){

  const destination =
    document.getElementById("destination").value;

  const date =
    document.getElementById("date").value;

  const message =
    document.getElementById("message");

  const results =
    document.getElementById("results");

  const list =
    document.getElementById("scheduleList");


  if(!destination || !date){

    message.innerHTML =
    '<div class="error">Pilih tujuan dan tanggal terlebih dahulu.</div>';

    return;
  }


  message.innerHTML =
  '<div class="success">Mencari jadwal...</div>';

  list.innerHTML="";
  results.style.display="none";


  try{

    /*
      Cari route terlebih dahulu.
      Karena schedules menggunakan route_id,
      bukan destination.
    */

    const routes = await supabase(
      "routes?origin=eq.Dumai&active=eq.true&select=id,destination"
    );


    const selectedRoute =
      routes.find(
        route => route.destination === destination
      );


    if(!selectedRoute){

      message.innerHTML =
      '<div class="error">Rute tidak ditemukan.</div>';

      return;
    }


    /*
      Cari jadwal berdasarkan route_id.
    */

    const schedules = await supabase(
      "schedules?departure_date=eq." +
      encodeURIComponent(date) +

      "&route_id=eq." +
      encodeURIComponent(selectedRoute.id) +

      "&status=eq.available" +

      "&select=id,route_id,vessel_id,departure_date,departure_time,price,available_seats,status"
    );


    message.innerHTML="";


    if(!schedules.length){

      results.style.display="block";

      list.innerHTML =
      '<p>Tidak ada jadwal pada tanggal tersebut.</p>';

      return;
    }


    results.style.display="block";


    schedules.forEach(schedule=>{

      const time =
      schedule.departure_time
      ? schedule.departure_time.substring(0,5)
      : "-";


      const priceNumber =
      Number(schedule.price);


      const price =
      priceNumber.toLocaleString("id-ID");


      /*
        Untuk sementara tampilkan available_seats
        dari schedule.
        Nanti kita sambungkan ke fungsi
        get_available_seats().
      */

      const seats =
      schedule.available_seats == null
      ? "-"
      : schedule.available_seats;


      const div =
      document.createElement("div");

      div.className="schedule";


      div.innerHTML=`

        <strong>
          Dumai → ${destination}
        </strong>

        <p>
          <span class="small">
            Tanggal
          </span><br>
          ${schedule.departure_date}
        </p>

        <p>
          <span class="small">
            Jam berangkat
          </span><br>
          ${time}
        </p>

        <p>
          <span class="small">
            Kursi tersedia
          </span><br>
          ${seats}
        </p>

        <div class="price">
          Rp ${price}
        </div>

        <button
          onclick='mulaiBooking(${JSON.stringify(schedule)})'
        >
          Lanjut Booking
        </button>

      `;


      list.appendChild(div);

    });

  }catch(error){

    console.error(error);

    message.innerHTML =
    '<div class="error">Gagal mengambil jadwal. Silakan coba lagi.</div>';
  }
}


/* ===============================
MULAI BOOKING
================================ */

function mulaiBooking(schedule){

  selectedSchedule = schedule;


  document.getElementById("searchCard")
  .classList.add("hidden");


  document.getElementById("bookingCard")
  .classList.remove("hidden");


  const time =
  schedule.departure_time
  ? schedule.departure_time.substring(0,5)
  : "-";


  const price =
  Number(schedule.price)
  .toLocaleString("id-ID");


  document.getElementById("bookingInfo").innerHTML = `

    <div class="success">

      <strong>
        Dumai → ${document.getElementById("destination").value}
      </strong>

      <br><br>

      Tanggal:
      ${schedule.departure_date}

      <br>

      Jam:
      ${time}

      <br>

      Harga:
      Rp ${price} / penumpang

    </div>

  `;


  document.getElementById("passengerCount").value="";

  document.getElementById("passengerList").innerHTML="";

  document.getElementById("totalBox").innerHTML="";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* ===============================
BUAT FORM PENUMPANG
================================ */

function buatPenumpang(){

  const count =
  Number(
    document.getElementById("passengerCount").value
  );


  const list =
  document.getElementById("passengerList");


  list.innerHTML="";


  if(!count || !selectedSchedule){

    document.getElementById("totalBox").innerHTML="";

    return;
  }


  for(let i=1;i<=count;i++){

    const div =
    document.createElement("div");

    div.className="passenger";


    div.innerHTML=`

      <h4>
        Penumpang ${i}
      </h4>

      <label>
        Nama Lengkap
      </label>

      <input
        type="text"
        class="passenger-name"
        placeholder="Nama lengkap penumpang"
      >

      <label>
        Identitas
      </label>

      <select class="passenger-id-type">

        <option value="">
          Pilih identitas
        </option>

        <option value="KTP">
          KTP
        </option>

        <option value="PASSPORT">
          Passport
        </option>

        <option value="OTHER">
          Lainnya
        </option>

      </select>

      <label>
        Nomor Identitas
      </label>

      <input
        type="text"
        class="passenger-id-number"
        placeholder="Nomor identitas"
      >

    `;


    list.appendChild(div);

  }


  const total =
  Number(selectedSchedule.price) * count;


  document.getElementById("totalBox").innerHTML = `

    <div class="total">
      Total:
      Rp ${total.toLocaleString("id-ID")}
    </div>

  `;
}


/* ===============================
KEMBALI
================================ */

function kembali(){

  document.getElementById("bookingCard")
  .classList.add("hidden");


  document.getElementById("searchCard")
  .classList.remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* ===============================
KONFIRMASI BOOKING
================================ */

async function simpanBooking(){

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const email =
    document.getElementById("customerEmail").value.trim();

  const count =
    Number(
      document.getElementById("passengerCount").value
    );

  const message =
    document.getElementById("bookingMessage");


  if(!selectedSchedule){

    message.innerHTML =
  '<div class="error">' +
  'Booking gagal:<br><br>' +
  error.message +
  '</div>';

    return;
  }


  if(!name || !phone){

    message.innerHTML =
      '<div class="error">Nama pemesan dan nomor WhatsApp wajib diisi.</div>';

    return;
  }


  if(!count){

    message.innerHTML =
      '<div class="error">Pilih jumlah penumpang.</div>';

    return;
  }


  const passengerNames =
    [...document.querySelectorAll(".passenger-name")];

  const passengerIdTypes =
    [...document.querySelectorAll(".passenger-id-type")];

  const passengerIdNumbers =
    [...document.querySelectorAll(".passenger-id-number")];


  const passengers = [];


  for(let i=0;i<count;i++){

    const passengerName =
      passengerNames[i].value.trim();

    const idType =
      passengerIdTypes[i].value;

    const idNumber =
      passengerIdNumbers[i].value.trim();


    if(
      !passengerName ||
      !idType ||
      !idNumber
    ){

      message.innerHTML =
        '<div class="error">Lengkapi semua data penumpang terlebih dahulu.</div>';

      return;
    }


    passengers.push({
      name: passengerName,
      id_type: idType,
      id_number: idNumber
    });

  }


  const button =
    document.querySelector(
      '#bookingCard button[onclick="simpanBooking()"]'
    );


  if(button){

    button.disabled = true;
    button.textContent = "Menyimpan Booking...";

  }


  message.innerHTML =
    '<div class="success">Menyimpan booking...</div>';


  try{

    const result =
      await supabase(
        "rpc/create_booking",
        {
          method:"POST",

          body:JSON.stringify({
            p_schedule_id:
              selectedSchedule.id,

            p_customer_name:
              name,

            p_customer_phone:
              phone,

            p_customer_email:
              email,

            p_passengers:
              passengers
          })
        }
      );


    const booking =
      Array.isArray(result)
      ? result[0]
      : result;


    if(!booking || !booking.success){

      throw new Error(
        "Booking gagal dibuat."
      );

    }


    document.getElementById("bookingCard")
      .classList.add("hidden");

    document.getElementById("successCard")
      .classList.remove("hidden");


    document.getElementById("bookingCode")
      .textContent =
      booking.booking_code;


    document.getElementById("successDetail")
      .innerHTML = `
            `;
        <p>
          <strong>Rute:</strong><br>
          Dumai →
          ${document.getElementById("destination").value}
        </p>

        <p>
          <strong>Tanggal:</strong><br>
          ${selectedSchedule.departure_date}
        </p>

        <p>
          <strong>Jumlah penumpang:</strong><br>
          ${booking.passenger_count}
        </p>

        <p>
          <strong>Total:</strong><br>
          Rp ${Number(
            booking.total_amount
          ).toLocaleString("id-ID")}
        </p>

        <div class="success">
          Booking sudah tersimpan di sistem.
        </div>

      `;
            startCountdown(booking.expires_at);

  }catch(error){

    console.error(error);


    message.innerHTML =
      '<div class="error">' +
      'Booking gagal disimpan. ' +
      'Silakan coba lagi.' +
      '</div>';


    if(button){

      button.disabled = false;
      button.textContent =
        "Konfirmasi Booking";

    }

  }

}


  function startCountdown(expiresAt){

  const countdown =
    document.getElementById("countdown");

  const countdownBox =
    document.getElementById("countdownBox");

  function updateCountdown(){

    const remaining =
      new Date(expiresAt).getTime() -
      Date.now();

    if(remaining <= 0){

      countdown.textContent = "00:00";

      countdownBox.innerHTML =
        "⏰ Waktu booking telah habis. " +
        "Silakan lakukan booking kembali.";

      return;
    }

    const minutes =
      Math.floor(remaining / 60000);

    const seconds =
      Math.floor(
        (remaining % 60000) / 1000
      );

    countdown.textContent =
      String(minutes).padStart(2,"0") +
      ":" +
      String(seconds).padStart(2,"0");

    setTimeout(updateCountdown,1000);
  }

  updateCountdown();
}
  
/* ===============================
JALANKAN
================================ */

loadRoutes();

</script>

</body>
</html>
