<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Batam Jet Booking</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #0b7a75;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 16px;
    }

    select,
    input {
      border: 1px solid #d5dbe5;
      background: white;
    }

    button {
      margin-top: 20px;
      border: none;
      background: #0b7a75;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      margin-top: 15px;
    }

    .error {
      background: #ffe7e7;
      color: #b00020;
      padding: 12px;
      border-radius: 10px;
    }

    .success {
      background: #e7f8ef;
      color: #087443;
      padding: 12px;
      border-radius: 10px;
    }

    #results {
      margin-top: 20px;
    }

    .schedule {
      border: 1px solid #e0e5ec;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      background: #fff;
    }

    .schedule strong {
      font-size: 18px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      color: #0b7a75;
      margin-top: 10px;
    }

    .small {
      color: #667085;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>Batam Jet Booking</h1>
  <p>Booking tiket kapal dari Dumai</p>
</header>

<div class="container">

  <div class="card">

    <h2>Cari Jadwal</h2>

    <label for="destination">Tujuan</label>

    <select id="destination">
      <option value="">Pilih tujuan</option>
    </select>

    <label for="date">Tanggal</label>

    <input
      type="date"
      id="date"
      value="2026-10-05"
    >

    <button onclick="cariJadwal()">
      Cari Jadwal
    </button>

    <div id="message"></div>

    <div id="results" style="display:none;">
      <h3>Jadwal Tersedia</h3>
      <div id="scheduleList"></div>
    </div>

  </div>

</div>

<script>

const SUPABASE_URL = "https://iymqjdfeadmqvxjanndq.supabase.co";

/*
  MASUKKAN PUBLISHABLE KEY SUPABASE KAMU
  yang sebelumnya sudah kamu gunakan.
*/
const SUPABASE_KEY = "sb_publishable__ihz_ZnsNjw8YxZyMA-eeg_TQQlWF89";


async function supabase(path) {

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + path,
    {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  const text = await response.text();

  if (!response.ok) {
    console.error("Supabase error:", text);
    throw new Error(text);
  }

  return text ? JSON.parse(text) : [];
}


/* LOAD TUJUAN */

async function loadRoutes() {

  const destination =
    document.getElementById("destination");

  try {

    const routes = await supabase(
      "routes?origin=eq.Dumai&active=eq.true&select=id,destination&order=destination"
    );

    routes.forEach(route => {

      const option =
        document.createElement("option");

      option.value = route.destination;

      option.textContent =
        "Dumai → " + route.destination;

      destination.appendChild(option);

    });

  } catch (error) {

    console.error(error);

    document.getElementById("message").innerHTML =
      '<div class="error">Gagal mengambil daftar tujuan.</div>';

  }

}


/* CARI JADWAL */

async function cariJadwal() {

  const destination =
    document.getElementById("destination").value;

  const date =
    document.getElementById("date").value;

  const message =
    document.getElementById("message");

  const results =
    document.getElementById("results");

  const list =
    document.getElementById("scheduleList");


  if (!destination || !date) {

    message.innerHTML =
      '<div class="error">Pilih tujuan dan tanggal terlebih dahulu.</div>';

    return;
  }


  message.innerHTML =
    '<div class="success">Mencari jadwal...</div>';

  results.style.display = "none";

  list.innerHTML = "";


  try {

    /*
      Ambil semua jadwal pada tanggal yang dipilih.
    */

    const schedules = await supabase(
      "schedules?departure_date=eq." +
      encodeURIComponent(date) +
      "&status=eq.available&select=id,route_id,departure_date,departure_time,price,available_seats,status"
    );


    /*
      Ambil semua rute aktif dari Dumai.
    */

    const routes = await supabase(
      "routes?origin=eq.Dumai&active=eq.true&select=id,destination"
    );


    /*
      Cari route_id berdasarkan tujuan.
    */

    const selectedRoute =
      routes.find(
        route => route.destination === destination
      );


    if (!selectedRoute) {

      throw new Error(
        "Rute tujuan tidak ditemukan."
      );

    }


    /*
      Cari jadwal yang route_id-nya sama.
    */

    const schedule =
      schedules.find(
        item =>
          String(item.route_id) ===
          String(selectedRoute.id)
      );


    message.innerHTML = "";

    results.style.display = "block";


    if (!schedule) {

      list.innerHTML =
        "<p>Tidak ada jadwal pada tanggal tersebut.</p>";

      return;

    }


    const time =
      schedule.departure_time
        ? schedule.departure_time.substring(0, 5)
        : "-";


    const price =
      Number(schedule.price)
        .toLocaleString("id-ID");


    list.innerHTML = `

      <div class="schedule">

        <strong>
          Dumai → ${destination}
        </strong>

        <p>
          <span class="small">Operator</span><br>
          Batam Jet
        </p>

        <p>
          <span class="small">Tanggal</span><br>
          ${schedule.departure_date}
        </p>

        <p>
          <span class="small">Jam berangkat</span><br>
          ${time}
        </p>

        <div class="price">
          Rp ${price}
        </div>

        <button onclick="booking()">
          Lanjut Booking
        </button>

      </div>

    `;

  } catch (error) {

    console.error(error);

    message.innerHTML =
      '<div class="error">Gagal mengambil jadwal. Silakan coba lagi.</div>';

  }

}


function booking() {

  alert(
    "Form data penumpang akan kita aktifkan pada tahap berikutnya."
  );

}


loadRoutes();

</script>

</body>
</html>
