<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Batam Jet Booking</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#0b7a75;
  color:white;
  padding:24px 20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:8px 0 0;
  opacity:.9;
}

.container{
  max-width:600px;
  margin:25px auto;
  padding:0 16px;
}

.card{
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  font-weight:bold;
}

select,
input,
button{
  width:100%;
  padding:13px;
  border-radius:10px;
  font-size:16px;
}

select,
input{
  border:1px solid #d5dbe5;
  background:white;
}

button{
  margin-top:20px;
  border:none;
  background:#0b7a75;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#e8edf2;
  color:#172033;
}

button.danger{
  background:#b42318;
}

.message{
  margin-top:15px;
}

.error{
  background:#ffe7e7;
  color:#b00020;
  padding:12px;
  border-radius:10px;
}

.success{
  background:#e7f8ef;
  color:#087443;
  padding:12px;
  border-radius:10px;
}

.schedule{
  border:1px solid #e0e5ec;
  border-radius:14px;
  padding:16px;
  margin-top:12px;
  background:#fff;
}

.schedule strong{
  font-size:18px;
}

.price{
  font-size:22px;
  font-weight:bold;
  color:#0b7a75;
  margin-top:10px;
}

.small{
  color:#667085;
  font-size:14px;
}

.hidden{
  display:none;
}

.passenger{
  border:1px solid #e0e5ec;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
}

.passenger h4{
  margin:0 0 10px;
}

.total{
  font-size:22px;
  font-weight:bold;
  color:#0b7a75;
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #ddd;
}

.booking-code{
  font-size:24px;
  font-weight:bold;
  letter-spacing:1px;
  text-align:center;
  margin:15px 0;
  color:#0b7a75;
}
</style>
</head>

<body>

<header>
  <h1>Batam Jet Booking</h1>
  <p>Booking tiket kapal dari Dumai</p>
</header>


<div class="container">

<!-- ================= CARI JADWAL ================= -->

<div class="card" id="searchCard">

<h2>Cari Jadwal</h2>

<label for="destination">Tujuan</label>

<select id="destination">
  <option value="">Pilih tujuan</option>
</select>

<label for="date">Tanggal</label>

<input
  type="date"
  id="date"
  value="2026-10-05"
>

<button onclick="cariJadwal()">
  Cari Jadwal
</button>

<div id="message"></div>

<div id="results" style="display:none">

<h3>Jadwal Tersedia</h3>

<div id="scheduleList"></div>

</div>

</div>


<!-- ================= FORM BOOKING ================= -->

<div class="card hidden" id="bookingCard">

<h2>Data Pemesanan</h2>

<div id="bookingInfo"></div>

<label for="customerName">
  Nama Pemesan
</label>

<input
  type="text"
  id="customerName"
  placeholder="Masukkan nama pemesan"
>

<label for="customerPhone">
  Nomor WhatsApp
</label>

<input
  type="tel"
  id="customerPhone"
  placeholder="Contoh: 08123456789"
>

<label for="customerEmail">
  Email (opsional)
</label>

<input
  type="email"
  id="customerEmail"
  placeholder="nama@email.com"
>

<label for="passengerCount">
  Jumlah Penumpang
</label>

<select id="passengerCount" onchange="buatFormPenumpang()">
  <option value="">Pilih jumlah</option>
</select>

<div id="passengerList"></div>

<div id="totalBox"></div>

<button onclick="simpanBooking()">
  Konfirmasi Booking
</button>

<button
  class="secondary"
  onclick="kembaliJadwal()"
>
  Kembali
</button>

<div id="bookingMessage"></div>

</div>


<!-- ================= HASIL BOOKING ================= -->

<div class="card hidden" id="successCard">

<h2>Booking Berhasil 🎉</h2>

<div class="success">
  Data booking berhasil disimpan.
</div>

<div class="booking-code" id="bookingCode"></div>

<div id="successDetail"></div>

<button onclick="location.reload()">
  Booking Baru
</button>

</div>

</div>


<script>

/
