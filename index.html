<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batam Jet Booking</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #075985;
      color: white;
      padding: 28px 20px;
      border-radius: 0 0 24px 24px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px #0000000d;
    }

    h2 {
      font-size: 19px;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin: 15px 0 7px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dce5;
      border-radius: 12px;
      background: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #075985;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
    }

    .schedule {
      border: 1px solid #dce3ec;
      padding: 16px;
      border-radius: 14px;
      margin-top: 12px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      color: #075985;
      margin-top: 8px;
    }

    .loading {
      text-align: center;
      padding: 15px;
    }

    .error {
      background: #fff1f2;
      color: #b91c1c;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>Batam Jet</h1>
  <p>Booking tiket kapal</p>
</header>

<main>

  <div class="card">

    <h2>Cari Jadwal</h2>

    <label>Tujuan</label>

    <select id="destination">
      <option value="">Pilih tujuan</option>
    </select>

    <label>Tanggal</label>

    <input
      type="date"
      id="date"
      value="2026-10-05"
    >

    <button onclick="cariJadwal()">
      Cari Jadwal
    </button>

    <div id="message"></div>

  </div>


  <div class="card" id="results" style="display:none">

    <h2>Jadwal Tersedia</h2>

    <div id="scheduleList"></div>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://iymqjdfeadmqvxjanndq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__ihz_ZnsNjw8YxZyMA-eeg_TQQlWF89";


async function supabase(path) {

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + path,
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  if (!response.ok) {
    throw new Error("Gagal mengambil data Supabase");
  }

  return response.json();
}


async function loadRoutes() {

  const destination =
    document.getElementById("destination");

  try {

    const routes = await supabase(
      "routes?origin=eq.Dumai&active=eq.true&select=id,destination&order=destination"
    );

    routes.forEach(route => {

      const option =
        document.createElement("option");

      option.value =
        route.destination;

      option.textContent =
        "Dumai → " + route.destination;

      destination.appendChild(option);

    });

  } catch (error) {

    console.error(error);

    document.getElementById("message").innerHTML =
      '<div class="error">Gagal mengambil data rute.</div>';

  }
}


async function cariJadwal() {

  const destination =
    document.getElementById("destination").value;

  const date =
    document.getElementById("date").value;

  const message =
    document.getElementById("message");

  const results =
    document.getElementById("results");

  const list =
    document.getElementById("scheduleList");


  if (!destination || !date) {

    message.innerHTML =
      '<div class="error">Pilih tujuan dan tanggal terlebih dahulu.</div>';

    return;
  }


  message.innerHTML =
    '<div class="loading">Mencari jadwal...</div>';


  try {

    /* Cari ID rute */

    const routes = await supabase(
      "routes?origin=eq.Dumai&destination=eq." +
      encodeURIComponent(destination) +
      "&active=eq.true&select=id"
    );


    if (!routes.length) {

      throw new Error("Rute tidak ditemukan");

    }


    const routeId =
      routes[0].id;


    /* Cari jadwal */

    const schedules = await supabase(
      "schedules?route_id=eq." +
      routeId +
      "&departure_date=eq." +
      date +
      "&status=eq.available" +
      "&select=departure_date,departure_time,price,available_seats,status"
    );


    message.innerHTML = "";

    results.style.display = "block";

    list.innerHTML = "";


    /* Tidak ada jadwal */

    if (!schedules.length) {

      list.innerHTML =
        "<p>Tidak ada jadwal pada tanggal tersebut.</p>";

      return;

    }


    /* Tampilkan jadwal */

    schedules.forEach(schedule => {

      const div =
        document.createElement("div");

      div.className =
        "schedule";


      const waktu =
        schedule.departure_time
          ? schedule.departure_time.slice(0, 5)
          : "-";


      const harga =
        Number(schedule.price)
          .toLocaleString("id-ID");


      div.innerHTML = `

        <strong>
          Dumai → ${destination}
        </strong>

        <p>
          Batam Jet
        </p>

        <p>
          Berangkat: ${waktu}
        </p>

        <div class="price">
          Rp ${harga}
        </div>

        <button onclick="booking()">
          Lanjut Booking
        </button>

      `;


      list.appendChild(div);

    });


  } catch (error) {

    console.error(
      "ERROR JADWAL:",
      error
    );

    message.innerHTML =
      '<div class="error">Gagal mengambil jadwal. Silakan coba lagi.</div>';

  }

}


function booking() {

  alert(
    "Form data penumpang akan kita aktifkan pada tahap berikutnya."
  );

}


loadRoutes();

</script>

</body>
</html>
